        required: true
      - in: query
        name: full_size
        schema:
          type: boolean
          nullable: true
          default: false
        description: whether to render the actual image and not a thumbnail version
      - in: query
        name: compressed
        schema:
          type: boolean
          nullable: true
        description: whether to compress the output image to reduce file size,defaults to opposite of `full_size`
      tags:
      - audio
      security:
      - Openverse API Token: []
      - {}
      responses:
        '200':
          description: Thumbnail image
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailed'
          description: ''
components:
  schemas:
    AudioWaveform:
      type: object
      properties:
        len:
          type: integer
          readOnly: true
        points:
          type: array
          items:
            type: number
            format: double
            maximum: 1
            minimum: 0
      required:
      - len
      - points
    ReasonEnum:
      enum:
      - mature
      - dmca
      - other
      type: string
      description: '* `mature` - mature

        * `dmca` - dmca

        * `other` - other'
    AudioReportRequest:
      type: object
      properties:
        identifier:
          type: string
          format: uuid
          description: Our unique identifier for an open-licensed work.
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          description: 'The reason to report media to Openverse.


            * `mature` - mature

            * `dmca` - dmca

            * `other` - other'
        description:
          type: string
          nullable: true
          description: The explanation on why media is being reported.
          maxLength: 500
      required:
      - identifier
      - reason
    Tag:
      type: object
      description: This output serializer serializes a singular tag.
      properties:
        name:
          type: string
          description: The name of a detailed tag.
        accuracy:
          type: number
          format: double
          nullable: true
          description: The accuracy of a machine-generated tag. Human-generated tags have a null accuracy field.
        unstable__provider:
          type: string
          nullable: true
          title: provider
          description: The source of the tag. When this field matches the provider for the record, the tag originated from the upstream provider. Otherwise, the tag was added with an external machine-generated labeling processes.
      required:
      - name
      - unstable__provider
    AudioAltFile:
      type: object
      description: 'A set of alternative files for a single audio object,

        rendered as a part of the ``AudioSerializer`` output.'
      properties:
        url:
          type: string
          format: uri
          description: URL of the alternative file.
        bit_rate:
          type: integer
          minimum: 0
          description: Bit rate of the alternative file.
        filesize:
          type: integer
          minimum: 0
          description: Size of the alternative file in bytes.
        filetype:
          type: string
          description: File type of the alternative file.
        sample_rate:
          type: integer
          minimum: 0
          description: Sample rate of the alternative file.
      required:
      - filetype
      - url
    Audio:
      type: object
      description: A single audio file. Used in search results.
      properties:
        id:
          type: string
          description: Our unique identifier for an open-licensed work.
        title:
          type: string
          nullable: true
          description: The name of the media.
        indexed_on:
          type: string
          format: date-time
          description: The timestamp of when the media was indexed by Openverse.
        foreign_landing_url:
          type: string
          nullable: true
          description: The landing page of the work.
        url:
          type: string
          nullable: true
          description: The actual URL to the media file.
          maxLength: 1000
        creator:
          type: string
          nullable: true
          description: The name of the media creator.
        creator_url:
          type: string
          nullable: true
          description: A direct link to the media creator.
          maxLength: 2000
        license:
          type: string
          description: The name of license for the media.
          maxLength: 50
        license_version:
          type: string
          nullable: true
          description: The version of the media license.
          maxLength: 25
        license_url:
          type: string
          nullable: true
          description: A direct link to the license deed or legal terms.
          readOnly: true
        provider:
          type: string
          nullable: true
          description: The content provider, e.g. Flickr, Jamendo...
          maxLength: 80
        source:
          type: string
          nullable: true
          description: 'The source of the data, meaning a particular dataset. Source and provider can be different. Eg: the Google Open Images dataset is source=openimages, but provider=flickr.'
          maxLength: 80
        category:
          type: string
          nullable: true
          description: The top-level classification of this media file.
          maxLength: 80
        genres:
          type: array
          items:
            type: string
            maxLength: 80
          nullable: true
          description: An array of audio genres such as `rock`, `electronic` for `music` category, or `politics`, `sport`, `education` for `podcast` category
        filesize:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Number in bytes, e.g. 1024.
        filetype:
          type: string
          nullable: true
          description: The type of the file, related to the file extension.
          maxLength: 80
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          nullable: true
          description: Tags with detailed metadata, such as accuracy.
        alt_files:
          type: array
          items:
            $ref: '#/components/schemas/AudioAltFile'
          readOnly: true
          nullable: true
          description: JSON describing alternative files for this audio.
        attribution:
          type: string
          nullable: true
          description: Legally valid attribution for the media item in plain-text English.
          readOnly: true
        fields_matched:
          type: array
          items: {}
          nullable: true
          description: List the fields that matched the query for this result.
        mature:
          type: boolean
          description: Whether the media item is marked as mature
        audio_set:
          allOf:
          - $ref: '#/components/schemas/AudioSet'
          readOnly: true
          nullable: true
          description: Reference to set of which this track is a part.
        duration:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: The time length of the audio file in milliseconds.
        bit_rate:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Number in bits per second, eg. 128000.
        sample_rate:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Number in hertz, eg. 44100.
        thumbnail:
          type: string
          format: uri
          readOnly: true
          nullable: true
          description: A direct link to the miniature artwork.
        detail_url:
          type: string
          format: uri
          readOnly: true
          description: A direct link to the detail view of this audio file.
        related_url:
          type: string
          format: uri
          readOnly: true
          description: A link to an endpoint that provides similar audio files.
        waveform:
          type: string
          format: uri
          readOnly: true
          description: A direct link to the waveform peaks.
      required:
      - alt_files
      - attribution
      - audio_set
      - detail_url
      - fields_matched
      - id
      - indexed_on
      - license
      - license_url
      - mature
      - related_url
      - tags
      - thumbnail
      - waveform
    Source:
      type: object
      properties:
        source_name:
          type: string
          description: The source of the media, e.g. flickr
        display_name:
          type: string
          description: The name of content source, e.g. Flickr
        source_url:
          type: string
          format: uri
          description: The URL of the source, e.g. https://www.flickr.com
        logo_url:
          type: string
          nullable: true
          readOnly: true
          description: The URL to a logo for the source.
          deprecated: true
        media_count:
          type: integer
          readOnly: true
          description: The number of media items indexed from the source.
      required:
      - display_name
      - logo_url
      - media_count
      - source_name
      - source_url
    NotFound:
      title: NotFound
      type: object
      properties:
        detail:
          type: string
          description: A description of what went wrong.
    AuthenticationFailed:
      title: AuthenticationFailed
      type: object
      properties:
        detail:
          type: string
          description: A description of what went wrong.
    ValidationError:
      title: ValidationError
      type: object
      properties:
        detail:
          oneOf:
          - type: string
            description: A description of what went wrong.
          - type: object
            additionalProperties: true
    NotAuthenticated:
      title: NotAuthenticated
      type: object
      properties:
        detail:
          type: string
          description: A description of what went wrong.
    PaginatedAudioList:
      type: object
      properties:
        result_count:
          type: integer
          description: The total number of items returned by search result.
          example: 10000
        page_count:
          type: integer
          description: The total number of pages returned by search result.
          example: 20
        page_size:
          type: integer
          description: The number of items per page.
          example: 20
        page:
          type: integer
          description: The current page number returned in the response.
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/Audio'
        warnings:
          type: array
          items:
            type: object
          description: Warnings pertinent to the request. If there are no warnings, this property will not be present on the response. Warnings are non-critical problems with the request. Responses with warnings should be treated as unstable. Warning descriptions must not be treated as machine readable and their schema can change at any time.
          example:
          - code: partially invalid request parameter
            message: Some of the request parameters were bad, but we were able to process the request. Here's some information that might help you fix the problem for future requests.
      required:
      - page_count
      - page_size
      - page
      - results
      - result_count
    AudioSet:
      type: object
      description: An audio set, rendered as a part of the ``AudioSerializer`` output.
      properties:
        title:
          type: string
          nullable: true
          description: The name of the media.
        foreign_landing_url:
          type: string
          nullable: true
          description: The landing page of the work.
        creator:
          type: string
          nullable: true
          description: The name of the media creator.
        creator_url:
          type: string
          nullable: true
          description: A direct link to the media creator.
          maxLength: 2000
        url:
          type: string
          nullable: true
          description: The actual URL to the media file.
          maxLength: 1000
        filesize:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Number in bytes, e.g. 1024.
        filetype:
          type: string
          nullable: true
          description: The type of the file, related to the file extension.
          maxLength: 80
  securitySchemes:
    Openverse API Token:
      type: http
      scheme: bearer
externalDocs:
  description: Openverse documentation
  url: http://docs.openverse.org/api/user/index.html
