        source: "\n# Get the details of audio ID 8624ba61-57f1-4f98-8a85-ece206c319cf\ncurl \\\n  -H \"Authorization: Bearer <Openverse API token>\" \\\n  \"https://api.openverse.org/v1/audio/8624ba61-57f1-4f98-8a85-ece206c319cf/\"\n"
  /v1/audio/{identifier}/related/:
    get:
      operationId: audio_related
      description: '

        Get related audio files for a specified audio track.


        By using this endpoint, you can get the details of related audio such as

        `id`, `title`, `indexed_on`, `foreign_landing_url`, `url`, `creator`, `creator_url`, `license`, `license_version`, `license_url`, `provider`, `source`, `category`, `genres`, `filesize`, `filetype`, `tags`, `alt_files`, `attribution`, `fields_matched`, `mature`, `audio_set`, `duration`, `bit_rate`, `sample_rate`, `thumbnail`, `detail_url`, `related_url`, `waveform`, `peaks` and `unstable__sensitivity`.'
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audio
      security:
      - Openverse API Token: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudioList'
              examples:
                OK:
                  value:
                    result_count: 10000
                    page_count: 20
                    page_size: 20
                    page: 1
                    results:
                    - title: File:Mozart - Eine kleine Nachtmusik - 1. Allegro.ogg
                      id: 36537842-b067-4ca0-ad67-e00ff2e06b2e
                      creator: Wolfgang Amadeus Mozart
                      creator_url: https://en.wikipedia.org/wiki/Wolfgang_Amadeus_Mozart
                      url: https://upload.wikimedia.org/wikipedia/commons/2/24/Mozart_-_Eine_kleine_Nachtmusik_-_1._Allegro.ogg
                      provider: wikimedia
                      source: wikimedia
                      license: by-sa
                      license_version: '2.0'
                      license_url: https://creativecommons.org/licenses/by-sa/2.0/
                      foreign_landing_url: https://commons.wikimedia.org/w/index.php?curid=3536953
                      detail_url: https://api.openverse.org/v1/audio/36537842-b067-4ca0-ad67-e00ff2e06b2e
                      related_url: https://api.openverse.org/v1/recommendations/audio/36537842-b067-4ca0-ad67-e00ff2e06b2e
                      fields_matched:
                      - description
                      - title
                      tags:
                      - name: exam
                      - name: tactics
                    warnings:
                    - code: partially invalid request parameter
                      message: Some of the request parameters were bad, but we were able to process the request. Here's some information that might help you fix the problem for future requests.
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailed'
              examples:
                Unauthorized:
                  value:
                    detail: Incorrect authentication credentials.
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              examples:
                NotFound:
                  value:
                    detail: An internal server error occurred.
                  summary: Not Found
          description: Not Found
      x-codeSamples:
      - lang: cURL
        source: "\n# Get related audio files for audio ID 8624ba61-57f1-4f98-8a85-ece206c319cf\ncurl \\\n  -H \"Authorization: Bearer <Openverse API token>\" \\\n  \"https://api.openverse.org/v1/audio/8624ba61-57f1-4f98-8a85-ece206c319cf/related/\"\n"
  /v1/audio/{identifier}/report/:
    post:
      operationId: audio_report
      description: 'Report an issue about a specified audio track to Openverse.


        By using this endpoint, you can report an audio track if it infringes

        copyright, contains mature or sensitive content or some other reason.'
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudioReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioReportRequest'
        required: true
      security:
      - Openverse API Token: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioReportRequest'
              examples:
                Created:
                  value:
                    identifier: 8624ba61-57f1-4f98-8a85-ece206c319cf
                    reason: mature
                    description: This audio contains sensitive content
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                BadRequest:
                  value:
                    detail:
                      <request parameter>: <error details>
                  summary: Bad Request
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailed'
              examples:
                Unauthorized:
                  value:
                    detail: Incorrect authentication credentials.
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              examples:
                NotFound:
                  value:
                    detail: Not found.
                  summary: Not Found
          description: Not Found
      x-codeSamples:
      - lang: cURL
        source: "\n# Report an issue about audio ID 8624ba61-57f1-4f98-8a85-ece206c319cf\ncurl \\\n  -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer <Openverse API token>\" \\\n  -d '{\"reason\": \"mature\", \"description\": \"This audio contains sensitive content\"}' \\\n  \"https://api.openverse.org/v1/audio/8624ba61-57f1-4f98-8a85-ece206c319cf/report/\"\n"
  /v1/audio/{identifier}/thumb/:
    get:
      operationId: audio_thumb
      description: 'Retrieve the scaled down and compressed thumbnail of the artwork of an

        audio track or its audio set.'
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: full_size
        schema:
          type: boolean
          nullable: true
          default: false
        description: whether to render the actual image and not a thumbnail version
      - in: query
        name: compressed
        schema:
          type: boolean
          nullable: true
        description: whether to compress the output image to reduce file size,defaults to opposite of `full_size`
      tags:
      - audio
      security:
      - Openverse API Token: []
      - {}
      responses:
        '200':
          description: Thumbnail image
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailed'
          description: ''
  /v1/audio/{identifier}/waveform/:
    get:
      operationId: audio_waveform
      description: 'Get the waveform peaks for an audio track.


        The peaks are provided as a list of numbers, each of these numbers being

        a fraction between 0 and 1. The list contains approximately 1000 numbers,

        although it can be slightly higher or lower, depending on the track''s length.'
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audio
      security:
      - Openverse API Token: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioWaveform'
              examples:
                OK:
                  value:
                    len: 1083
                    points:
                    - 0.61275
                    - 0.19593
                    - 0.74023
                    - 0.00089
                    - 0.00043
                    - 0.00049
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailed'
              examples:
                Unauthorized:
                  value:
                    detail: Incorrect authentication credentials.
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
              examples:
                NotFound:
                  value:
                    detail: An internal server error occurred.
                  summary: Not Found
          description: Not Found
      x-codeSamples:
      - lang: cURL
        source: "\n# Get the waveform of audio ID 8624ba61-57f1-4f98-8a85-ece206c319cf\ncurl \\\n  -H \"Authorization: Bearer <Openverse API token>\" \\\n  -H \"Content-Type: application/json\" \\\n  \"https://api.openverse.org/v1/audio/8624ba61-57f1-4f98-8a85-ece206c319cf/waveform/\"\n"
  /v1/audio/stats/:
    get:
      operationId: audio_stats
      description: '

        Get a list of all content sources and their respective number of

        audio files in the Openverse catalog.


        By using this endpoint, you can obtain info about content sources such

        as `source_name`, `display_name`, `source_url`, `logo_url` and `media_count`.'
      tags:
      - audio
      security:
      - Openverse API Token: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
              examples:
                OK:
                  value:
                  - source_name: freesound
                    display_name: Freesound
                    source_url: https://freesound.org/
                    logo_url: null
                    media_count: 827
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailed'
              examples:
                Unauthorized:
                  value:
                    detail: Incorrect authentication credentials.
          description: Unauthorized
      x-codeSamples:
      - lang: cURL
        source: "\n# Get the statistics for audio sources\ncurl \\\n  -H \"Authorization: Bearer <Openverse API token>\" \\\n  \"https://api.openverse.org/v1/audio/stats/\"\n"
  /v1/images/{identifier}/thumb/:
    get:
      operationId: images_thumb
      description: Retrieve the scaled down and compressed thumbnail of the image.
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
